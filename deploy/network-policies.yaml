apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quixsi-server-netpol
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: quixsi-server
      component: server
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: quixsi-ui
          component: frontend
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx  # Allow ingress controller
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - {} # Allow all egress for now - restrict as needed
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quixsi-ui-netpol
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: quixsi-ui
      component: frontend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx  # Allow ingress controller
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: quixsi-server
          component: server
    ports:
    - protocol: TCP
      port: 8080
  - to: []  # Allow DNS resolution
    ports:
    - protocol: UDP
      port: 53